services:
  ledgerline:
    build: .
    ports:
      - "3000:3000"
    environment:
      STORE_URL: ${STORE_URL}
    restart: unless-stopped
    # The Polyphony fault: the readiness route queries Neon every 30 s, so it never sleeps.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 3s
