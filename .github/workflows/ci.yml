name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# Rapid pushes to the same ref supersede each other — cancel the stale run instead of
# queueing redundant CI. (Deploy workflows keep cancel-in-progress: false; CI is safe to cancel.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Installs node + pnpm from mise.toml — single source of truth with local dev.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      # mise-action caches the toolchain but NOT the pnpm content-addressable store —
      # cache it so `pnpm install --frozen-lockfile` is a link-only operation on a warm key.
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Seam check (no personal data in framework files)
        run: pnpm check-seam

      - name: Boundary check (consumer -> framework only)
        run: pnpm check-boundaries

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.14.6"

      - name: Format
        run: terraform fmt -check -recursive infra

      - name: Init + validate
        working-directory: infra/examples/single-tool
        run: |
          terraform init -backend=false
          terraform validate

      - name: Test (mock providers — no creds, no resources)
        working-directory: infra/examples/single-tool
        run: terraform test

      - name: Neon module — validate (real provider schema) + test (mock)
        working-directory: infra/modules/neon
        run: |
          terraform init -backend=false
          terraform validate
          terraform test

      - name: Security scan (advisory)
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: infra
          soft_fail: true
